<script>
(function () {
  var box = JSON.parse(document.getElementById('box').textContent), f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go');
  function bytes(b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  f.addEventListener('submit', function (e) {
    e.preventDefault(); msg.textContent = '';
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot open the page. Try a current version of Chrome, Edge, Safari or Firefox.'; return; }
    go.disabled = true; go.textContent = 'Opening...';
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value.normalize('NFKC')), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(box.s), iterations: box.n, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(box.i) }, k, bytes(box.d)); })
      .then(function (buf) { var html = new TextDecoder().decode(buf); document.open(); document.write(html); document.close(); })
      .catch(function () { go.disabled = false; go.textContent = 'Open the page'; msg.textContent = 'That password did not open the page. Check it and try again.'; pw.select(); });
  });
})();
