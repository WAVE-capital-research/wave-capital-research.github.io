<script>
(function () {
  var KEY = 'wave-trial-pass';
  var box = JSON.parse(document.getElementById('box').textContent), f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go'), wait = document.getElementById('wait');
  function bytes(b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function remembered() { try { return window.sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function remember(p) { try { window.sessionStorage.setItem(KEY, p); } catch (e) {} }
  function forget() { try { window.sessionStorage.removeItem(KEY); } catch (e) {} }
  function open(p) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(p.normalize('NFKC')), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(box.s), iterations: box.n, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(box.i) }, k, bytes(box.d)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var can = !!(window.crypto && window.crypto.subtle && window.TextEncoder);
  f.addEventListener('submit', function (e) {
    e.preventDefault(); msg.textContent = '';
    if (!can) { msg.textContent = 'This browser cannot open the page. Try a current version of Chrome, Edge, Safari or Firefox.'; return; }
    var p = pw.value.trim();
    go.disabled = true; go.textContent = 'Opening...';
    open(p).then(function (html) { remember(p); show(html); })
      .catch(function () { go.disabled = false; go.textContent = 'Open the page'; msg.textContent = 'That password did not open the page. Check it and try again.'; pw.select(); });
  });
  /* One prompt per visit: try the password this tab already used. If that fails, show the normal prompt. */
  var saved = can ? remembered() : '';
  if (saved) {
    f.hidden = true; wait.hidden = false;
    open(saved).then(show).catch(function () { forget(); wait.hidden = true; f.hidden = false; pw.focus(); });
  }
})();
